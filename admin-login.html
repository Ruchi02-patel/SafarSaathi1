<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login – SafarSaathi</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body style="background-color: #0f172a;">
  <div class="auth-wrapper" style="background-color: #0f172a;">
    <div class="auth-card" style="max-width: 520px; grid-template-columns: 1fr; border-color: #334155;">
      <div class="auth-form-column" style="padding: 44px;">
        <div class="auth-brand" style="text-align: center;">
          <a href="/" class="logo-link">
            <div class="logo-icon" style="background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);">🛡️</div>
            <span class="logo-name">SafarSaathi Admin</span>
          </a>
        </div>

        <div class="form-header" style="text-align: center;">
          <h2>Administrator Portal</h2>
          <p>Super Admin Access & Regional RTO Management</p>
        </div>

        <div id="alertBox"></div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label" for="email">Admin Email</label>
            <input type="email" id="email" class="form-control" placeholder="admin@safarsaathi.com" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg"
            style="background: #ea580c; border-color: #ea580c; margin-top: 14px;">
            <span>Authorize Admin Session</span>
          </button>
        </form>

        <div class="demo-box" style="background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 12px 16px; margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span class="demo-tag" style="color: #c2410c; font-weight: 700; font-size: 13px;">🎓 Evaluator Demo Credentials</span>
            <button type="button" class="btn btn-sm btn-outline" style="border-color: #c2410c; color: #c2410c;" onclick="quickFillAdmin()">1-Click Fill</button>
          </div>
          <div class="demo-creds" style="font-size: 12.5px; color: #7c2d12;">
            <strong>Email:</strong> admin@safarsaathi.com | <strong>Pass:</strong> admin123
          </div>
        </div>

        <div class="auth-footer-text">
          <a href="/login" style="color: #64748b;">← Return to Citizen Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function quickFillAdmin() {
      document.getElementById('email').value = 'admin@safarsaathi.com';
      document.getElementById('password').value = 'admin123';
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = '<span>Verifying Admin Rights...</span>';

      try {
        const res = await apiPost('/auth/admin-login', { email, password });
        showAlert('alertBox', 'Admin authentication successful! Entering console...', 'success');
        setAuthSession(res.token, res.admin, true);
        setTimeout(() => {
          window.location.href = '/admin/dashboard';
        }, 800);
      } catch (err) {
        showAlert('alertBox', err.message || 'Invalid admin credentials.');
        btn.disabled = false;
        btn.innerHTML = '<span>Authorize Admin Session</span>';
      }
    });
  </script>
</body>

</html>
