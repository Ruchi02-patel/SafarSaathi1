<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vehicles – SafarSaathi</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="page-content">
        <div class="vehicles-page">
          <!-- Page Header -->
          <div class="page-header">
            <div>
              <h1 class="page-title">My Registered Vehicles</h1>
              <p class="page-subtitle">Manage your garage, insurance status, documents, and service history.</p>
            </div>
            <a href="/vehicles/add" class="btn btn-primary">
              <span>+ Add Vehicle</span>
            </a>
          </div>

          <div id="alertBox"></div>

          <!-- Vehicle List Container (Screenshot #5) -->
          <div id="vehiclesList" class="vehicles-list">
            <div class="loading-state">
              <div class="spinner"></div>
              <p>Loading your vehicles...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/vehicles.js"></script>
</body>
</html>
